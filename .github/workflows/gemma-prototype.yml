name: Gemma prototype checks
on:
  workflow_dispatch:
  push:
    branches: [codex/gemma-summary-prototype]
    paths: ['gemma-prototype/**', 'settings.gradle.kts', '.github/workflows/gemma-prototype.yml']
permissions:
  contents: read
concurrency:
  group: gemma-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Build and test the isolated prototype
        run: ./gradlew :gemma-prototype:testDebugUnitTest :gemma-prototype:lintDebug :gemma-prototype:assembleDebug :gemma-prototype:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Start Android emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/gemma-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name gemma --path "$ANDROID_AVD_HOME/gemma.avd" --package 'system-images;android-30;default;x86_64' --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/gemma.avd" > "$ANDROID_AVD_HOME/gemma.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd gemma -cores 2 -memory 3072 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          timeout 120s adb wait-for-device
          ready=false
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          "$ready"
          adb shell input keyevent 82
      - name: Check Android UI and native runtime loading
        run: ./gradlew :gemma-prototype:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Collect device logs
        if: always()
        run: |
          mkdir -p gemma-evidence
          timeout 20s adb logcat -d > gemma-evidence/logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gemma-prototype-apk-and-checks
          path: |
            gemma-prototype/build/outputs/apk/debug/*.apk
            gemma-prototype/build/reports/
            gemma-prototype/build/outputs/androidTest-results/
            gemma-evidence/
            emulator.log
          retention-days: 14
