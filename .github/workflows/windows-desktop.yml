name: Windows desktop checks and installer
on:
  push:
    branches: [main, feature/windows-desktop]
    paths: ['desktop/**', '.github/workflows/windows-desktop.yml', 'app/src/main/java/**', 'app/src/main/cpp/nemotron_jni.cpp']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/speaker-worker/requirements.txt
      - name: Compile desktop and run JVM checks
        id: jvm
        shell: pwsh
        run: ./gradlew.bat -p desktop test --no-daemon --console=plain
      - name: Build pinned Windows speech libraries
        id: native
        shell: pwsh
        run: ./desktop/native/build-windows.ps1
      - name: Build and verify packaged speaker worker
        id: worker
        shell: pwsh
        run: ./desktop/speaker-worker/build.ps1
      - name: Real speaker model checks
        shell: pwsh
        run: |
          python desktop/speaker-worker/smoke_test.py --worker desktop/resources/windows-x64/speaker-worker/speaker-worker.exe --work desktop/build/speaker-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Speaker model checks failed' }
      - name: Cancel real speaker analysis without losing audio
        shell: pwsh
        run: ./gradlew.bat -p desktop speakerCancellationCheck --no-daemon --console=plain
      - name: Verify real speech model and decoder timing
        if: ${{ !cancelled() && steps.jvm.outcome == 'success' && steps.native.outcome == 'success' }}
        shell: pwsh
        run: |
          python desktop/scripts/prepare-speech-smoke.py desktop/build/speech-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture preparation failed' }
          $fixtures = (Resolve-Path desktop/build/speech-evidence).Path
          ./gradlew.bat -p desktop speechSmoke "-PspeechFixtures=$fixtures" --no-daemon --console=plain 2>&1 | Tee-Object desktop/build/speech-evidence/result.log
          if ($LASTEXITCODE -ne 0) { throw 'Speech model check failed' }
          $output = Get-Content desktop/build/speech-evidence/result.log -Raw
          if ($output -notmatch 'timed_words=22' -or $output -notmatch 'ask what you can do for your country') { throw 'Incomplete native transcript or word timing' }
      - name: Package Windows installer and portable app
        id: package
        if: ${{ !cancelled() && steps.jvm.outcome == 'success' && steps.native.outcome == 'success' && steps.worker.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gradlew.bat -p desktop packageExe packageMsi createDistributable --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          New-Item -ItemType Directory -Force desktop/build/release | Out-Null
          Copy-Item desktop/build/compose/binaries/main/exe/*.exe desktop/build/release/
          Copy-Item desktop/build/compose/binaries/main/msi/*.msi desktop/build/release/
          Compress-Archive -Path desktop/build/compose/binaries/main/app/LiveMeetingNotes -DestinationPath desktop/build/release/LiveMeetingNotes-windows-x64-portable.zip
      - name: Install and launch packaged Windows app
        id: installed
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: ./desktop/scripts/test-installed-app.ps1
      - name: Collect release checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/build/release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 desktop/build/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-desktop-evidence
          path: |
            desktop/build/reports/
            desktop/build/test-results/
            desktop/build/speaker-evidence/smoke-results.json
            desktop/build/speaker-evidence/cancellation/worker-cancellation.json
            desktop/build/speech-evidence/result.log
            desktop/build/install-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: LiveMeetingNotes-windows-x64
          path: desktop/build/release/
          retention-days: 30
