name: Android native ABI checks
on:
  push:
    branches: [codex/backup-restore-delete]
    paths:
      - '.github/workflows/android-native-abis.yml'
      - 'scripts/build-native-android.sh'
      - 'scripts/check-native-page-alignment.py'
      - 'scripts/test-native-page-alignment.py'
      - 'scripts/test-native-android-abis.sh'
      - 'scripts/native-patches/**'
      - 'app/src/main/cpp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-abis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NEMOTRON_NATIVE_JOBS: '2'
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned native and emulator tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build ripgrep
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          sdkmanager 'ndk;27.2.12479018' 'platform-tools' 'emulator' 'system-images;android-30;default;x86_64'
          mkdir -p native-evidence
          "$ANDROID_HOME/emulator/emulator" -version > native-evidence/emulator-version.txt 2>&1
          sdkmanager --list_installed > native-evidence/sdk-packages.txt
      - name: Test ELF validation on the host
        run: |
          set -o pipefail
          python3 scripts/test-native-page-alignment.py 2>&1 | tee native-evidence/alignment-tests.txt
          bash -n scripts/build-native-android.sh scripts/test-native-android-abis.sh
      - name: Build all four complete Android ABIs
        run: |
          set -o pipefail
          scripts/build-native-android.sh arm64-v8a armeabi-v7a x86 x86_64 2>&1 | tee native-evidence/native-build.txt
          scripts/test-native-android-abis.sh --build-only x86 x86_64 2>&1 | tee native-evidence/smoke-build.txt
      - name: Start accelerated Android API 30 emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/native-abi-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name native_abis --path "$ANDROID_AVD_HOME/native_abis.avd" --package 'system-images;android-30;default;x86_64' --device pixel_2
          test -s "$ANDROID_AVD_HOME/native_abis.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/native_abis.avd" > "$ANDROID_AVD_HOME/native_abis.ini"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd native_abis -port 5554 -cores 2 -memory 2048 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > native-evidence/emulator.txt 2>&1 &
          timeout 120s adb wait-for-device
          ready=false
          for attempt in $(seq 1 90); do
            if [ "$(timeout 10s adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          "$ready"
          adb shell getprop ro.product.cpu.abilist | tee native-evidence/device-abis.txt
          # Require the advertised primary ABI; a missing 32-bit ABI is reported as SKIP by the probe.
          [[ ",$(tr -d '\r\n' < native-evidence/device-abis.txt)," == *",x86_64,"* ]]
      - name: Run native x86 and x86_64 Android baselines
        run: |
          set -o pipefail
          scripts/test-native-android-abis.sh --run-only x86 x86_64 2>&1 | tee native-evidence/smoke-run.txt
      - name: Collect device diagnostics and coverage summary
        if: always()
        run: |
          mkdir -p native-evidence
          timeout 20s adb logcat -d > native-evidence/logcat.txt 2>&1 || true
          {
            echo 'Native ABI checks: build and ELF validation target all four release ABIs.'
            echo 'Runtime probes target only advertised x86/x86_64 ABIs on Android API 30.'
            echo 'These checks exercise library loading, JNI exports, public API initialization, and small CPU tensor operations. They do not test model inference or ARM runtime behavior.'
            if [ -f build/native-android/smoke/results.txt ]; then cat build/native-android/smoke/results.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-native-abi-evidence-${{ github.sha }}
          path: |
            native-evidence/
            build/native-android/*-build.json
            build/native-android/smoke/
          retention-days: 14
