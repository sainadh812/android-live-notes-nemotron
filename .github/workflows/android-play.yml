name: Android Play build
on:
  push:
    branches: [codex/play-support-purchases]
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed Play AAB using the existing upload key stored in repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check and build production-package debug APK
        run: |
          python3 scripts/check-native-page-alignment.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Configure existing Play upload key
        if: inputs.signed_release == true
        env:
          UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['UPLOAD_KEYSTORE', 'UPLOAD_STORE_PASSWORD', 'UPLOAD_KEY_ALIAS', 'UPLOAD_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four PLAY_UPLOAD_* repository secrets using the existing upload key. No replacement key will be generated.')
          key = Path(os.environ['RUNNER_TEMP']) / 'play-upload.jks'
          key.write_bytes(base64.b64decode(os.environ['UPLOAD_KEYSTORE'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          values = {'storeFile': str(key), 'storePassword': os.environ['UPLOAD_STORE_PASSWORD'],
                    'keyAlias': os.environ['UPLOAD_KEY_ALIAS'], 'keyPassword': os.environ['UPLOAD_KEY_PASSWORD']}
          config = Path('signing.properties')
          config.write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()) + '\n')
          config.chmod(0o600)
          PY
      - name: Build signed Play bundle
        if: inputs.signed_release == true
        run: ./gradlew :app:lintRelease :app:bundleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-notes-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.signed_release == true
        with:
          name: live-notes-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-play-checks
          path: app/build/reports/
      - name: Remove temporary signing files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('signing.properties').unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'play-upload.jks').unlink(missing_ok=True)
          PY
