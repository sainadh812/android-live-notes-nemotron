name: Android Play build
on:
  push:
    branches: [codex/play-support-purchases, codex/note-organization]
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed Play AAB using the existing upload key stored in repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore original Preview signing key
        env:
          PREVIEW_KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('PREVIEW_KEYSTORE')
          if not value:
              raise SystemExit('Configure ANDROID_PREVIEW_KEYSTORE_BASE64 with the original Preview key. A new key would prevent updates to installed apps.')
          key = Path(os.environ['RUNNER_TEMP']) / 'original-preview.jks'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          PY
          keytool -exportcert -keystore "$RUNNER_TEMP/original-preview.jks" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/preview-cert.der"
          echo "f7313f98e9414c166f3fb2d2a9329ba1bb5dd9d76b068254522d20d1f8b109f9  $RUNNER_TEMP/preview-cert.der" | sha256sum --check
      - name: Check and build phone Preview APK
        run: |
          python3 scripts/check-native-page-alignment.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PpreviewBuild=true -PdevelopmentKeystore="$RUNNER_TEMP/original-preview.jks" --no-daemon --console=plain
      - name: Verify Preview update identity
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          cert = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', apk], text=True)
          print(next(line for line in cert.splitlines() if 'certificate SHA-256 digest:' in line))
          if 'Signer #1 certificate SHA-256 digest: f7313f98e9414c166f3fb2d2a9329ba1bb5dd9d76b068254522d20d1f8b109f9' not in cert:
              raise SystemExit('Preview signing certificate changed; refusing to distribute an incompatible update.')
          manifest = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', apk], text=True)
          if "package: name='com.sainadh.livenotes.preview'" not in manifest:
              raise SystemExit('Phone Preview APK must use its separate package.')
          version_code = int(re.search(r"versionCode='([0-9]+)'", manifest).group(1))
          if version_code <= 7:
              raise SystemExit('Preview version code must be newer than the installed 1.2.0 Preview (7).')
          subprocess.run([str(tools / 'zipalign'), '-c', '-P', '16', '4', apk], check=True)
          Path('phone-apk').mkdir()
          import shutil
          shutil.copy2(apk, 'phone-apk/LiveMeetingNotes-1.2.1-preview.apk')
          print('Verified original Preview certificate, separate package and 16 KB APK alignment.')
          PY
      - name: Configure existing Play upload key
        if: inputs.signed_release == true
        env:
          UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['UPLOAD_KEYSTORE', 'UPLOAD_STORE_PASSWORD', 'UPLOAD_KEY_ALIAS', 'UPLOAD_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four PLAY_UPLOAD_* repository secrets using the existing upload key. No replacement key will be generated.')
          key = Path(os.environ['RUNNER_TEMP']) / 'play-upload.jks'
          key.write_bytes(base64.b64decode(os.environ['UPLOAD_KEYSTORE'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          values = {'storeFile': str(key), 'storePassword': os.environ['UPLOAD_STORE_PASSWORD'],
                    'keyAlias': os.environ['UPLOAD_KEY_ALIAS'], 'keyPassword': os.environ['UPLOAD_KEY_PASSWORD']}
          config = Path('signing.properties')
          config.write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()) + '\n')
          config.chmod(0o600)
          PY
      - name: Build signed Play bundle
        if: inputs.signed_release == true
        run: ./gradlew :app:lintRelease :app:bundleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-notes-preview-apk
          path: phone-apk/LiveMeetingNotes-1.2.1-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.signed_release == true
        with:
          name: live-notes-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-play-checks
          path: app/build/reports/
      - name: Remove temporary signing files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('signing.properties').unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'play-upload.jks').unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'original-preview.jks').unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'preview-cert.der').unlink(missing_ok=True)
          PY
